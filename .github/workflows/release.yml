# Builds all platform binaries and publishes a GitHub release when a
# version tag is pushed.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:

  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.25'

    - name: Check formatting
      run: make fmt-check

    - name: Test
      run: go test -v ./...

    - name: Vet
      run: make vet

    - name: Build
      run: make

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" bin/* --title "$GITHUB_REF_NAME" --generate-notes
